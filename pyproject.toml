[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ila-manager"
version = "0.1.0"
description = "Visual port manager and Vivado TCL / HDL port-map generator for AMD Vivado ILA IP cores"
readme = "README.md"
authors = [
    { name = "parama-ch" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[project.scripts]
ila-manager = "ila_manager.cli:main"

[project.urls]
Homepage = "https://github.com/parama-ch/ILA-Manager"
Repository = "https://github.com/parama-ch/ILA-Manager.git"
Issues = "https://github.com/parama-ch/ILA-Manager/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ila_manager"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
