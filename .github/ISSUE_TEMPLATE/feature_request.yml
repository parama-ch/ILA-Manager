name: Feature Request
description: Suggest an idea or improvement for ILA Manager
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a new feature!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or a specific Vivado workflow?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like this feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
